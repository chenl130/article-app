services:
  - type: web
    name: immigration-article-studio
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: BETA_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
